name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: target/cvxgenrust-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pytest-args: tests
          - os: ubuntu-latest
            pytest-args: tests -k "not test_sdp_matches_cvxpy_solution"
          - os: windows-latest
            pytest-args: tests -k "not test_sdp_matches_cvxpy_solution"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run pytest ${{ matrix.pytest-args }}
