name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/cvxgenrust-ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            pytest-args: tests -m "not (sdp and numerical)"
          - os: ubuntu-latest
            pytest-args: tests -m "not (sdp and numerical)"
          - os: windows-latest
            pytest-args: tests -m "not (sdp and numerical)"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: true

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run tests
        run: uv run python -m pytest ${{ matrix.pytest-args }}
