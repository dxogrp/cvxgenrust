[project]
name = "cvxgenrust"
version = "0.1.0"
description = "Embedded Rust code generation for CVXPY"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [
    { name = "Hao Zhu", email = "zhuh@cs.uni-freiburg.de"},
]
keywords = [
    "cvxpy",
    "convex optimization",
    "code-generation",
    "rust",
    "clarabel",
]
dependencies = [
    "cvxpy>=1.9",
    "numpy>=1.26",
    "scipy>=1.13",
]

[project.urls]
Repository = "https://github.com/dxogrp/cvxgenrust"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cvxgenrust"]

[tool.hatch.build.targets.sdist]
only-include = [
    "/cvxgenrust",
    "/README.md",
    "/LICENSE",
    "/pyproject.toml",
]

[dependency-groups]
dev = [
    "build>=1.2",
    "pytest>=8.3",
    "twine>=6.0",
]
examples = [
    "marimo>=0.13",
    "matplotlib>=3.9",
]

[tool.pytest.ini_options]
markers = [
    "metadata: fast code-generation and manifest checks",
    "rust_smoke: builds and runs a generated Rust executable",
    "python_wrapper: builds and loads the generated Python/CVXPY wrapper",
    "numerical: compares generated solver results with CVXPY",
    "sdp: exercises semidefinite cone support and SDP backend selection",
]
