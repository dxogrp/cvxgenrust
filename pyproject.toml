[project]
name = "cvxgenrust"
version = "0.1.0"
description = "Embedded Rust code generation for CVXPY"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cvxpy>=1.9",
    "numpy>=1.26",
    "scipy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.3",
]
examples = [
    "marimo>=0.13",
    "matplotlib>=3.9",
]

[tool.cvxgenrust]
clarabel-version = "0.11.1"
generated-requires-python = ">=3.12"
maturin-version = ">=1.7,<2"
pyo3-version = "0.25"
python-dependencies = [
    "cvxpy>=1.9",
    "numpy>=1.26",
]

[tool.pytest.ini_options]
markers = [
    "metadata: fast code-generation and manifest checks",
    "rust_smoke: builds and runs a generated Rust executable",
    "python_wrapper: builds and loads the generated Python/CVXPY wrapper",
    "numerical: compares generated solver results with CVXPY",
    "sdp: exercises semidefinite cone support and SDP backend selection",
]
